name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create tar archive
      run: |
        tar -czf deploy_patch.tar.gz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='./deploy_patch.tar.gz' \
          --exclude='vendor' \
          --exclude='node_modules' \
          --exclude='.env' \
          --exclude='storage/logs' \
          --exclude='storage/framework/cache' \
          --exclude='storage/framework/sessions' \
          --exclude='storage/framework/views' \
          --exclude='public_html/storage' \
          . || true
        ls -lh deploy_patch.tar.gz

    - name: Upload tar to Hostinger via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        source: "deploy_patch.tar.gz"
        target: "/home/u664715641/"
        timeout: 120s
        strip_components: 0

    - name: Extract & Clear Cache on Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 120s
        script: |
          set -e
          DOMAIN_DIR="/home/u664715641/domains/airsegarprigen.hvmdigital.id"
          
          cd /home/u664715641
          
          # Extract ke root domain (bukan ke dalam public_html)
          tar -xzf deploy_patch.tar.gz -C "$DOMAIN_DIR/" 2>&1
          rm -f deploy_patch.tar.gz
          
          # Buat/perbaiki symlink storage
          STORAGE_LINK="$DOMAIN_DIR/public_html/storage"
          STORAGE_TARGET="$DOMAIN_DIR/storage/app/public"
          rm -rf "$STORAGE_LINK"
          ln -s "$STORAGE_TARGET" "$STORAGE_LINK"
          echo "Storage symlink OK: $(ls -la $STORAGE_LINK)"
          
          # Set permissions
          chmod -R 775 "$DOMAIN_DIR/storage" "$DOMAIN_DIR/bootstrap/cache" 2>/dev/null || true
          
          # Clear cache & optimize
          cd "$DOMAIN_DIR"
          php artisan migrate --force 2>&1
          php artisan optimize:clear 2>&1
          php artisan view:cache 2>&1
          
          echo "Deploy selesai!"
